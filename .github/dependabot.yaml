# Dependabot version updates.
#
# This repo is a pnpm workspace (webapp, functions, ingest, mcp) with a single
# lockfile at the repo root. Dependabot must run against the workspace root so
# it updates pnpm-lock.yaml together with each package.json. Per-package
# entries (e.g. /functions, /webapp) leave the root lockfile stale, which makes
# `pnpm install --frozen-lockfile` fail in CI (ERR_PNPM_OUTDATED_LOCKFILE).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
