# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deploy

on:
  push:
    branches: [master]
  pull_request: {}

permissions:
  id-token: write
  contents: read

jobs:
  deploy-functions:
    concurrency:
      group: 'functions'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build functions
        run: pnpm --filter functions... build
      - name: Firebase Deploy (functions)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: |
          pnpm exec firebase deploy --only functions --debug --token ${{ secrets.FIREBASE_TOKEN }}

  build-ingest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build ingest
        run: pnpm --filter ingest... typecheck
      
  deploy-mcp:
    concurrency:
      group: 'mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        # Context is the repo root, not mcp/: pnpm needs the root lockfile and
        # pnpm-workspace.yaml to resolve the `catalog:` protocol.
        run: docker build -f mcp/Dockerfile -t veganflora-mcp:${{ github.sha }} .
      - name: Authenticate to Google Cloud
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/520915943790/locations/global/workloadIdentityPools/github-deploy-auth-pool/providers/github-deploy-auth-provider
          service_account: 520915943790-compute@developer.gserviceaccount.com
      - name: Set up gcloud
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Push image
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          IMAGE: europe-north1-docker.pkg.dev/veganflora/cloud-run-source-deploy/veganflora-mcp:${{ github.sha }}
        run: |
          gcloud auth configure-docker europe-north1-docker.pkg.dev --quiet
          docker tag veganflora-mcp:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"
      - name: Cloud Run Deploy (mcp)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          IMAGE: europe-north1-docker.pkg.dev/veganflora/cloud-run-source-deploy/veganflora-mcp:${{ github.sha }}
        run: |
          gcloud run deploy veganflora-mcp \
            --image="$IMAGE" \
            --project=veganflora \
            --region=europe-north1 \
            --allow-unauthenticated \
            --set-secrets="MCP_BEARER_TOKEN=MCP_BEARER_TOKEN:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --service-account=520915943790-compute@developer.gserviceaccount.com \
            --memory=512Mi --cpu=1 --min-instances=0 --max-instances=3 \
            --quiet

  deploy-webapp:
    concurrency:
      group: 'web'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22]
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build webapp
        run: pnpm --filter webapp... build
      - name: Firebase Deploy (hosting)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        run: pnpm exec firebase deploy --only hosting --token ${{ secrets.FIREBASE_TOKEN }}
      - name: Send deploy message to slack
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          YYYYMMDD=$(date '+%Y-%m-%d %H:%M:%S')
          GIT_MESSAGE=$(git log -1 --pretty=format:'%s')
          if [ -z "${GIT_MESSAGE}" ]; then
            GIT_MESSAGE="No commit message found."
          fi
          MESSAGE=" ☘️ Veganflora functions has been deployed at: \`${YYYYMMDD}\`\n\n\`\`\`${GIT_MESSAGE}\`\`\`"